[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prototta"
version = "0.1.0"
description = "Reusable prototype-guided test-time adaptation for PyTorch models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[tool.setuptools.packages.find]
include = ["ProtoTTA*"]
